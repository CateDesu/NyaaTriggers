name: Release

# Tags build stable releases using the matching source version. Main pushes build
# rolling releases stamped with the source version and run number. Pruning removes older
# rolling releases while preserving milestone tags.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# Grant write access only to jobs that publish or prune releases.
permissions:
  contents: read

# Serialize builds per ref so newer main pushes supersede older rolling builds without
# cancelling milestone tags.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  meta:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      rolling: ${{ steps.v.outputs.rolling }}
      suffix: ${{ steps.v.outputs.suffix }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: v
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            TAG="$REF_NAME"
            VER="${TAG#v}"
            # Require the source version to match an explicit tag so the installed build
            # reports the right version.
            BASE=$(grep -oP '^_VERSION\s*=\s*"\K[^"]+' nyaatriggers/app_common.py)
            if [ "$BASE" != "$VER" ]; then
              echo "::error::_VERSION $BASE does not match tag $TAG"; exit 1
            fi
            PRE=false
            SUFFIX=""
            ROLL=false
          else
            BASE=$(grep -oP '^_VERSION\s*=\s*"\K[^"]+' nyaatriggers/app_common.py)
            if [ -z "$BASE" ]; then echo "::error::could not read _VERSION from nyaatriggers/app_common.py"; exit 1; fi
            VER="${BASE}.${{ github.run_number }}"
            # Only main can publish rolling releases.
            if [ "$REF_NAME" != "main" ]; then
              echo "::error::branch $REF_NAME has no release channel"; exit 1
            fi
            PRE=false
            SUFFIX=""
            TAG="v${VER}"
            ROLL=true
          fi
          {
            echo "tag=$TAG"
            echo "version=$VER"
            echo "prerelease=$PRE"
            echo "rolling=$ROLL"
            echo "suffix=$SUFFIX"
          } >> "$GITHUB_OUTPUT"
          echo "Building tag=$TAG version=$VER prerelease=$PRE rolling=$ROLL"

      # Require rolling versions to advance beyond published releases. Ignore drafts
      # that may belong to builds still running.
      - name: Refuse to regress the rolling channel
        if: steps.v.outputs.rolling == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.v.outputs.tag }}
          SUFFIX: ${{ steps.v.outputs.suffix }}
        run: |
          gh api --paginate --slurp "repos/${{ github.repository }}/releases?per_page=100" > release-pages.json
          jq 'add | map({tagName: .tag_name, isDraft: .draft, isPrerelease: .prerelease})' release-pages.json > releases.json
          python3 tools/release_policy.py check "$TAG" < releases.json

  # Require all test suites to pass before building or publishing.
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install system deps for tests
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-xkb1 libxcb-icccm4 libxcb-shape0 libxcb-keysyms1 \
            libgl1 libnss3 libasound2 mono-devel xvfb
      - name: Install Python dependencies
        run: |
          pip install PyQt6==6.11.0 PyQt6-WebEngine==6.11.0 websockets==16.1.1 regex==2026.7.19 packaging==26.3 numpy==2.3.5
      - name: Run test suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m tests
      - name: Check translation catalog is in sync
        run: python tools/extract_strings.py --check

  release:
    needs: [meta, test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Fetch voice model
        run: |
          curl -fL --retry 3 --retry-all-errors -o voices/en_US-arctic-medium.onnx \
            "https://huggingface.co/rhasspy/piper-voices/resolve/v1.0.0/en/en_US/arctic/medium/en_US-arctic-medium.onnx"

      # Check the voice against its pinned release checksum.
      - name: Verify voice model checksum
        run: echo "483303e294947a3ec2f910ea96093d876e1640f5772e9d89e511d6c82c667286  voices/en_US-arctic-medium.onnx" | sha256sum -c

      - name: Create/refresh the GitHub release with voice assets
        uses: softprops/action-gh-release@v3
        with:
          # Pass the computed tag for rolling builds. Keep the release draft until both
          # platform archives are ready.
          tag_name: ${{ needs.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ needs.meta.outputs.prerelease }}
          draft: true
          generate_release_notes: true
          files: |
            voices/en_US-arctic-medium.onnx
            voices/en_US-arctic-medium.onnx.json

  # Build the engine jar once and share it with both platform jobs.
  build-sidecar:
    needs: [meta, test]
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build triggevent-core.jar
        run: bash triggevent-core/build.sh

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Verify engine recovery
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb libegl1 libxkbcommon0 libgl1
          pip install PyQt6==6.11.0 regex==2026.7.19 packaging==26.3
          python3 triggevent-core/test_recovery.py --compare
          python3 triggevent-core/test_recovery_protocol.py
          python3 triggevent-core/test_custom_triggers.py

      - name: Upload sidecar jar
        uses: actions/upload-artifact@v4
        with:
          name: triggevent-core-jar
          path: triggevent-core/target/triggevent-core.jar
          if-no-files-found: error
          retention-days: 1

      # Capture an optional startup inventory so fresh installs can list engine triggers
      # before their first launch.
      - name: Harvest Triggevent inventory seed
        continue-on-error: true
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb
          # Keep stdin open long enough for the engine to emit inventory.
          sleep 180 | xvfb-run -a -s "-screen 0 1024x768x24" \
            java -jar triggevent-core/target/triggevent-core.jar > engine.out 2> engine.err &
          JPID=$!
          for _ in $(seq 1 60); do
            grep -aq '"inventory"' engine.out && break
            sleep 2
          done
          kill "$JPID" 2>/dev/null || true
          python3 - <<'PY'
          import json, sys
          try:
              lines = open('engine.out', encoding='utf-8', errors='replace').read().splitlines()
          except OSError:
              lines = []
          seed = None
          for line in lines:
              line = line.strip()
              if '"inventory"' not in line:
                  continue
              try:
                  msg = json.loads(line)
              except ValueError:
                  continue
              if msg.get('t') == 'inventory' and isinstance(msg.get('triggers'), list):
                  seed = [
                      {'source': 'triggevent', 'id': t.get('id', ''),
                       'fight': t.get('fight', ''), 'group': t.get('group', ''),
                       'name': t.get('name') or t.get('id', ''), 'text': t.get('text', '')}
                      for t in msg['triggers'] if isinstance(t, dict) and t.get('id')
                  ]
                  break
          if not seed:
              sys.stderr.write('No inventory line captured; skipping seed.\n')
              sys.exit(1)
          with open('triggevent_inventory.seed.json', 'w', encoding='utf-8') as f:
              json.dump(seed, f)
          print(f'Harvested {len(seed)} Triggevent triggers into the seed.')
          PY

      - name: Upload Triggevent inventory seed
        uses: actions/upload-artifact@v4
        with:
          name: triggevent-seed
          path: triggevent_inventory.seed.json
          if-no-files-found: warn
          retention-days: 1

  build-windows:
    needs: [meta, release, build-sidecar, test]
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # Keep dependency versions in sync with requirements.txt and the voice installers.
      - name: Install dependencies
        run: |
          pip install PyQt6==6.11.0 PyQt6-WebEngine==6.11.0 piper-tts==1.6.0 pyinstaller==6.21.0 pillow==12.3.0 kokoro-onnx==0.4.7 regex==2026.7.19 websockets==16.1.1 packaging==26.3

      - name: Verify source updates on Windows
        run: python -m tests test_updater_integration

      # Stamp rolling builds with the release version so the updater recognizes them as
      # current.
      - name: Stamp rolling version into _VERSION
        if: needs.meta.outputs.rolling == 'true'
        shell: bash
        env:
          VER: ${{ needs.meta.outputs.version }}
        run: |
          python - <<'PY'
          import os, re, pathlib
          ver = os.environ["VER"]
          p = pathlib.Path("nyaatriggers/app_common.py")
          s = p.read_text(encoding="utf-8")
          s, n = re.subn(r'(?m)^(_VERSION\s*=\s*")[^"]+(")', r'\g<1>' + ver + r'\g<2>', s, count=1)
          assert n == 1, "did not patch _VERSION"
          p.write_text(s, encoding="utf-8")
          print("stamped _VERSION =", ver)
          PY

      - name: Generate exe icon
        run: python -c "from PIL import Image; Image.open('assets/icon_nyaa.png').save('assets/icon_nyaa.ico', sizes=[(256,256),(128,128),(64,64),(48,48),(32,32),(16,16)])"

      - name: Fetch voice model
        run: curl.exe -fL --retry 3 --retry-all-errors -o voices/en_US-arctic-medium.onnx "https://huggingface.co/rhasspy/piper-voices/resolve/v1.0.0/en/en_US/arctic/medium/en_US-arctic-medium.onnx"

      - name: Verify voice model checksum
        shell: bash
        run: echo "483303e294947a3ec2f910ea96093d876e1640f5772e9d89e511d6c82c667286  voices/en_US-arctic-medium.onnx" | sha256sum -c

      - name: Download Triggevent sidecar jar
        uses: actions/download-artifact@v4
        with:
          name: triggevent-core-jar
          path: triggevent-core/target

      - name: Download Triggevent inventory seed (best-effort)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: triggevent-seed
          path: .

      - name: Bundle Temurin JRE 17
        shell: bash
        run: |
          curl.exe -fL --retry 3 --retry-all-errors -o jre.zip "https://api.adoptium.net/v3/binary/latest/17/ga/windows/x64/jre/hotspot/normal/eclipse"
          # Check the JRE archive against the checksum reported for this binary.
          python - <<'PY'
          import json, urllib.request, hashlib, sys
          url = ("https://api.adoptium.net/v3/assets/feature_releases/17/ga"
                 "?architecture=x64&image_type=jre&jvm_impl=hotspot&os=windows"
                 "&page=0&page_size=1&vendor=eclipse")
          # Adoptium requires an explicit User-Agent for this request.
          req = urllib.request.Request(url, headers={"User-Agent": "NyaaTriggers-CI/1.0"})
          meta = json.load(urllib.request.urlopen(req, timeout=30))
          expected = meta[0]["binaries"][0]["package"]["checksum"].lower()
          h = hashlib.sha256()
          with open("jre.zip", "rb") as f:
              for chunk in iter(lambda: f.read(1 << 20), b""):
                  h.update(chunk)
          actual = h.hexdigest().lower()
          if actual != expected:
              sys.exit(f"JRE checksum mismatch: expected {expected}, got {actual}")
          print(f"JRE checksum OK ({actual})")
          PY

      - name: Extract Temurin JRE
        run: |
          Expand-Archive -Path jre.zip -DestinationPath jre-tmp
          $inner = (Get-ChildItem jre-tmp -Directory)[0].FullName
          Move-Item $inner jre

      - name: Build with PyInstaller
        run: pyinstaller NyaaTriggers.spec

      - name: Verify bundled version stamp
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: python -c "import os; from pathlib import Path; assert Path('dist/NyaaTriggers/_internal/nyaatriggers.version').read_text(encoding='utf-8') == os.environ['VERSION']"

      - name: Verify bundled assets shipped
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          for source in Path('assets').iterdir():
              if source.suffix in {'.json', '.png'}:
                  bundled = Path('dist/NyaaTriggers/_internal/assets') / source.name
                  assert bundled.read_bytes() == source.read_bytes(), f'Bundled asset missing or changed: {source.name}'
          PY

      - name: Verify both engines shipped
        run: |
          $jar = 'dist\NyaaTriggers\_internal\triggevent-core\target\triggevent-core.jar'
          $java = 'dist\NyaaTriggers\_internal\jre\bin\java.exe'
          $tn = 'dist\NyaaTriggers\_internal\triggernometry-core\bin\triggernometry-core.exe'
          if (-not (Test-Path $jar))  { throw "engine jar missing from the build: $jar" }
          if (-not (Test-Path $java)) { throw "bundled JRE missing from the build: $java" }
          if (-not (Test-Path $tn -PathType Leaf)) { throw "Triggernometry missing from the build: $tn" }
          if ((Get-Item $jar).Length -lt 1MB) { throw "engine jar is too small to be the fat jar" }

      - name: Verify the bundled timelines shipped
        run: |
          $src = 'dist\NyaaTriggers\_internal\timelines'
          if (-not (Test-Path "$src\UMAD.txt")) { throw "bundled timeline missing from the build: $src\UMAD.txt" }
          if ((Get-ChildItem "$src\*.cactbot.txt").Count -eq 0) {
            throw "cactbot dungeon timelines missing from the build: $src"
          }

      - name: Zip release folder
        run: Compress-Archive -Path dist\NyaaTriggers -DestinationPath NyaaTriggers-windows.zip

      - name: Verify packaged Windows update and restart
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          QT_QPA_PLATFORM: offscreen
        run: python tools/check_packaged_update.py NyaaTriggers-windows.zip --version $env:VERSION

      - name: Write SHA-256 sidecar
        shell: bash
        run: sha256sum NyaaTriggers-windows.zip > NyaaTriggers-windows.zip.sha256

      - name: Upload Windows build to release
        run: gh release upload ${{ needs.meta.outputs.tag }} NyaaTriggers-windows.zip NyaaTriggers-windows.zip.sha256 --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    needs: [meta, release, build-sidecar, test]
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install system deps for PyQt6 runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-xkb1 libxcb-icccm4 libxcb-shape0 libxcb-keysyms1 \
            libgl1 libnss3 libasound2

      - name: Install Python dependencies
        run: |
          pip install PyQt6==6.11.0 PyQt6-WebEngine==6.11.0 piper-tts==1.6.0 pyinstaller==6.21.0 kokoro-onnx==0.4.7 regex==2026.7.19 websockets==16.1.1 packaging==26.3

      - name: Stamp rolling version into _VERSION
        if: needs.meta.outputs.rolling == 'true'
        shell: bash
        env:
          VER: ${{ needs.meta.outputs.version }}
        run: |
          python - <<'PY'
          import os, re, pathlib
          ver = os.environ["VER"]
          p = pathlib.Path("nyaatriggers/app_common.py")
          s = p.read_text(encoding="utf-8")
          s, n = re.subn(r'(?m)^(_VERSION\s*=\s*")[^"]+(")', r'\g<1>' + ver + r'\g<2>', s, count=1)
          assert n == 1, "did not patch _VERSION"
          p.write_text(s, encoding="utf-8")
          print("stamped _VERSION =", ver)
          PY

      - name: Fetch voice model
        run: |
          curl -fL --retry 3 --retry-all-errors -o voices/en_US-arctic-medium.onnx \
            "https://huggingface.co/rhasspy/piper-voices/resolve/v1.0.0/en/en_US/arctic/medium/en_US-arctic-medium.onnx"

      - name: Verify voice model checksum
        run: echo "483303e294947a3ec2f910ea96093d876e1640f5772e9d89e511d6c82c667286  voices/en_US-arctic-medium.onnx" | sha256sum -c

      - name: Download Triggevent sidecar jar
        uses: actions/download-artifact@v4
        with:
          name: triggevent-core-jar
          path: triggevent-core/target

      - name: Download Triggevent inventory seed (best-effort)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: triggevent-seed
          path: .

      - name: Bundle Temurin JRE 17
        run: |
          curl -fL --retry 3 --retry-all-errors -o jre.tar.gz \
            "https://api.adoptium.net/v3/binary/latest/17/ga/linux/x64/jre/hotspot/normal/eclipse"
          # Check the JRE archive against the checksum reported for this binary.
          python3 - <<'PY'
          import json, urllib.request, hashlib, sys
          url = ("https://api.adoptium.net/v3/assets/feature_releases/17/ga"
                 "?architecture=x64&image_type=jre&jvm_impl=hotspot&os=linux"
                 "&page=0&page_size=1&vendor=eclipse")
          # Adoptium requires an explicit User-Agent for this request.
          req = urllib.request.Request(url, headers={"User-Agent": "NyaaTriggers-CI/1.0"})
          meta = json.load(urllib.request.urlopen(req, timeout=30))
          expected = meta[0]["binaries"][0]["package"]["checksum"].lower()
          h = hashlib.sha256()
          with open("jre.tar.gz", "rb") as f:
              for chunk in iter(lambda: f.read(1 << 20), b""):
                  h.update(chunk)
          actual = h.hexdigest().lower()
          if actual != expected:
              sys.exit(f"JRE checksum mismatch: expected {expected}, got {actual}")
          print(f"JRE checksum OK ({actual})")
          PY
          mkdir -p jre-tmp
          tar -xzf jre.tar.gz -C jre-tmp
          mv "$(find jre-tmp -mindepth 1 -maxdepth 1 -type d | head -1)" jre

      - name: Build with PyInstaller
        run: pyinstaller NyaaTriggers.spec

      - name: Verify bundled version stamp
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: python -c "import os; from pathlib import Path; assert Path('dist/NyaaTriggers/_internal/nyaatriggers.version').read_text(encoding='utf-8') == os.environ['VERSION']"

      - name: Verify bundled assets shipped
        run: |
          python - <<'PY'
          from pathlib import Path
          for source in Path('assets').iterdir():
              if source.suffix in {'.json', '.png'}:
                  bundled = Path('dist/NyaaTriggers/_internal/assets') / source.name
                  assert bundled.read_bytes() == source.read_bytes(), f'Bundled asset missing or changed: {source.name}'
          PY

      - name: Verify both engines shipped
        run: |
          jar=dist/NyaaTriggers/_internal/triggevent-core/target/triggevent-core.jar
          java=dist/NyaaTriggers/_internal/jre/bin/java
          tn=dist/NyaaTriggers/_internal/triggernometry-core/bin/triggernometry-core.exe
          test -f "$jar" || { echo "engine jar missing from the build: $jar"; exit 1; }
          test -x "$java" || { echo "bundled JRE missing from the build: $java"; exit 1; }
          test -f "$tn" || { echo "Triggernometry missing from the build: $tn"; exit 1; }
          test "$(stat -c%s "$jar")" -ge 1000000 || { echo "engine jar too small"; exit 1; }

      # Include the launcher so runtime recovery can run before Python starts.
      - name: Add launcher script
        run: |
          cp NyaaTriggers.sh dist/NyaaTriggers/NyaaTriggers.sh
          chmod +x dist/NyaaTriggers/NyaaTriggers.sh

      - name: Verify the bundled timelines shipped
        run: |
          test -f dist/NyaaTriggers/_internal/timelines/UMAD.txt || { echo "bundled timeline missing from the build"; exit 1; }
          ls dist/NyaaTriggers/_internal/timelines/*.cactbot.txt > /dev/null || { echo "cactbot dungeon timelines missing from the build"; exit 1; }

      - name: Tar release folder
        run: |
          cd dist
          tar -czf ../NyaaTriggers-linux.tar.gz NyaaTriggers

      - name: Verify packaged Linux update and restart
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          QT_QPA_PLATFORM: offscreen
        run: python tools/check_packaged_update.py NyaaTriggers-linux.tar.gz --version "$VERSION"

      - name: Write SHA-256 sidecar
        run: sha256sum NyaaTriggers-linux.tar.gz > NyaaTriggers-linux.tar.gz.sha256

      - name: Upload Linux build to release
        run: |
          gh release upload ${{ needs.meta.outputs.tag }} NyaaTriggers-linux.tar.gz NyaaTriggers-linux.tar.gz.sha256 --clobber
          # Publish the engine separately for independent updates, including its
          # existing checksum sidecar.
          (cd triggevent-core/target && sha256sum triggevent-core.jar) > triggevent-core.jar.sha256
          gh release upload ${{ needs.meta.outputs.tag }} triggevent-core/target/triggevent-core.jar triggevent-core.jar.sha256 --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Publish after both platform archives are ready. Failed builds leave a draft so users
  # retain the previous release.
  publish:
    needs: [meta, build-windows, build-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: release-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - name: Publish release (un-draft)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.meta.outputs.tag }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api --paginate --slurp "repos/${{ github.repository }}/releases?per_page=100" > release-pages.json
          jq 'add | map({tagName: .tag_name, isDraft: .draft, isPrerelease: .prerelease})' release-pages.json > releases.json
          LATEST=$(python3 tools/release_policy.py latest "$TAG" < releases.json)
          gh release edit "$TAG" --draft=false --latest="$LATEST"
          echo "Published $TAG"

  # Prune superseded rolling releases only after publication. Preserve milestone tags as
  # rollback choices.
  prune-rolling:
    needs: [meta, publish]
    if: needs.meta.outputs.rolling == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Delete superseded rolling releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEEP: ${{ needs.meta.outputs.tag }}
        run: |
          gh api --paginate --slurp "repos/${{ github.repository }}/releases?per_page=100" > release-pages.json
          jq 'add | map({tagName: .tag_name, isDraft: .draft, isPrerelease: .prerelease})' release-pages.json > releases.json
          python3 tools/release_policy.py prune "$KEEP" < releases.json > superseded.txt
          while read -r t; do
            [ -z "$t" ] && continue
            echo "Pruning superseded rolling release $t"
            gh release delete "$t" --cleanup-tag --yes
          done < superseded.txt
