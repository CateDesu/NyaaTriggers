# Notify Discord when code lands on main. Configure the repository Actions secret
# DISCORD_WEBHOOK with the channel webhook URL.
name: Discord notify

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Post push to Discord
        env:
          # Pass commit text through the environment to avoid interpreting it as script
          # code.
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "DISCORD_WEBHOOK secret not set — skipping."
            exit 0
          fi
          # Truncate messages to Discord's limit and fail on HTTP errors while logging
          # the status.
          jq -nc --arg c "📦 Push to **${REPO}** (${REF}) by ${ACTOR}

          ${COMMIT_MSG}
          ${COMMIT_URL}" \
            '{content:(if ($c|length) > 2000 then ($c[:1999] + "…") else $c end), username:"NyaaTriggers"}' \
            | curl -sS --fail-with-body -w '\nDiscord HTTP %{http_code}\n' \
                -X POST -H "Content-Type: application/json" -d @- "$DISCORD_WEBHOOK"
